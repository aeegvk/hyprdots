# Print a new line at the start of the prompt
add_newline = true

# Format of the status
format = """$directory $character"""

right_format = """$cmd_duration $git_branch $git_status"""


#-------character--------#
#------------------------#
[character]
success_symbol = "[-❯](bold fg:green)"
error_symbol = "[-❯](bold fg:red)"
vimcmd_symbol = "[-❮](bold fg:yellow)"
vimcmd_visual_symbol = "[-❮](bold fg:blue)"
vimcmd_replace_symbol = "[-❮](bold fg:purple)"
vimcmd_replace_one_symbol = "[-❮](bold fg:purple)"

#------directory---------#
#------------------------#
[directory]
style = 'bold bright-white'
truncation_length = 6
truncation_symbol = "../"
format = '[$path]($style)'

#------gitBranch-------#
#----------------------#
[git_branch]
style = 'bold purple'
symbol = ""
truncation_length = 12
truncation_symbol = ""
format = '[$symbol $branch(:$remote_branch)]($style)'


#------gitStatus-------#
#----------------------#
[git_status]
style = "bold purple"
format = "[$modified$deleted$untracked$ahead_behind]($style) "
modified = " "
deleted = " "
untracked = " "
ahead = " "
behind = " "
up_to_date = " "

#-----cmdDuration------#
#----------------------#
[cmd_duration]
min_time = 0
format = '[󰪢 $duration](bold blue)'
